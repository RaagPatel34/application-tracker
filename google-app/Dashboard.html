  --sidebar-accent: #f5f5f5;

* {

}
body {

button,a,input,select {

}
button:not(:disabled),select {

}
button:disabled {

}
a {
  text-decoration: none;
}
.app-shell {
  display: flex;
  min-height: 100vh;
}

  border-right: 1px solid #e4e9e6;

}

}

}
.brand-icon {

  height: 42px;

}

  color: #99a49f;

}
.nav-item {

}
.nav-item span {

}

  background: #d3e5db;
  padding: 1px 7px;

  font-size: 11px;
}
.sidebar-bottom {

  padding-top: 55px;
}
.privacy-card {
  padding: 18px 13px;

  border: 1px solid #e8eee6;
  border-radius: 9px;
  color: #6b8173;
}
.privacy-card b {
  display: block;
  color: #4b6252;
  font-size: 12px;
  margin: 10px 0 7px;
}
.privacy-card p {

  line-height: 1.7;
  margin: 0;
}
.profile {

  gap: 9px;
  border-top: 1px solid #ebeeec;
  padding: 20px 5px 0;

}
.avatar {
  background: #eee9df;
  color: #766246;

  height: 31px;

  place-items: center;
  border-radius: 50%;
  flex-shrink: 0;
}
.profile b {
  font-size: 11px;
  display: block;
}
.profile small {
  display: block;

  text-overflow: ellipsis;
  color: #97a199;
  font-size: 10px;
  margin-top: 4px;
}
main {
  min-width: 0;
  flex: 1;
}
.topbar {
  height: 70px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #e4e9e6;

}
.breadcrumb {

  gap: 12px;
  font-size: 12px;
  color: #9ca59f;
}

  color: #59655e;
}
.private-label {

  font-size: 11px;
  color: #8a958e;
}
.demo-banner {

  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: #687b6e;
  background: #eef4ee;
  border-bottom: 1px solid #e1eae1;
}
.demo-banner>span {
  display: flex;
  align-items: center;
}
.demo-banner b {
  font-weight: 600;
}
.demo-banner button {

  align-items: center;
  color: #285548;
  font-weight: 600;
}
.demo-dot,.tiny-dot {

  height: 5px;
  background: #6d9978;

}
.content {

}
.page-heading {

  justify-content: space-between;
  gap: 25px;
  margin-bottom: 28px;
}
.eyebrow {

  letter-spacing: 1.6px;
  font-weight: 650;
  color: #8b978e;
}
.page-heading h1 {
  font-size: 29px;
  letter-spacing: -1px;
  font-weight: 600;
  line-height: 1.3;
  margin: 10px 0;
}
.page-heading p {
  color: #8a948e;
  font-size: 12px;
  margin: 0;
}
.primary-action {
  font-size: 12px;
  padding: 19px 16px;
  border-radius: 6px;
  box-shadow: 0 3px 5px #193f2810;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 15px;
  margin-bottom: 26px;
}
.stat {
  border: 1px solid #e3e8e4;
  background: #fff;
  border-radius: 9px;
  padding: 19px 21px;
  text-align: left;
  transition: transform .15s;
}
.stat:hover {
  transform: translateY(-2px);
}
.stat>div {
  display: flex;

  font-size: 11px;
}
.stat strong {

  font-size: 32px;

  font-weight: 600;
  margin: 9px 0 2px;
}
.stat small {
  font-size: 10px;
  color: #99a398;
}
.stat.interview {
  background: #f1f5fd;
  border-color: #e1e8f3;
}
.stat.interview strong,.stat.interview svg {
  color: #5d7daf;
}
.stat.secured {
  background: #eef5ee;
  border-color: #dfeadd;
}
.stat.secured strong,.stat.secured svg {
  color: #5c835e;
}
.overview-split {
  display: grid;
  grid-template-columns: minmax(0,1fr) 245px;
  gap: 22px;
}
.table-card {
  background: #fff;
  border: 1px solid #e4e9e5;
  border-radius: 9px;
  overflow: hidden;
}
.section-heading {
  padding: 22px 23px 19px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
h2 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -.3px;
  margin: 0;
}
.section-heading p {
  font-size: 10px;
  color: #97a298;
  margin: 6px 0 0;
}
.section-heading button {
  font-size: 11px;
  color: #637268;
}
.table-controls {
  display: flex;
  gap: 11px;
  padding: 0 23px 20px;
}
.search-input {
  position: relative;
  flex: 1;
  min-width: 0;
}
.search-input>svg {
  position: absolute;
  left: 10px;
  top: 10px;
  color: #99a59c;
}
.search-input input {
  padding-left: 33px;
  height: 35px;
  font-size: 11px;
  background: #fff;
  box-shadow: none;
  border-color: #e3e8e4;
}
.table-controls select {
  border: 1px solid #e3e8e4;
  border-radius: 6px;
  background: #fff;
  padding: 6px 8px;
  color: #758478;
  font-size: 11px;
  width: 147px;
}
th {
  font-size: 9px !important;
  letter-spacing: .6px;
  font-weight: 500 !important;
  color: #95a199 !important;
  background: #fafbf9;
  height: 37px !important;
  padding: 0 15px !important;
}
td {
  padding: 16px 15px !important;
  border-color: #edf0ed !important;
}
th:first-child,td:first-child {
  padding-left: 23px !important;
}
tr {
  border-color: #edf0ed !important;
}
.company-cell {
  display: flex;
  gap: 11px;
  align-items: center;
}
.company-avatar {
  height: 32px;
  width: 32px;
  flex-shrink: 0;
  border-radius: 7px;

  font-size: 13px;
  font-weight: 600;
}
.tone-0 {
  background: #f2e9e8;
  color: #ae7b76;
}
.tone-1 {
  background: #e8eeed;
  color: #688c87;
}
.tone-2 {
  background: #edf0e6;
  color: #819366;
}
.tone-3 {
  background: #eaeaf2;
  color: #8a7aa6;
}
.tone-4 {
  background: #e8edf3;
  color: #7c8dad;
}
.company-cell strong {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: #46584b;
}
.company-cell div>span {

}
.date-cell {
  color: #98a298;

}
.status-pill {
  display: inline-flex;

  padding: 5px 7px;
  font-size: 9px;
  font-weight: 500;
  white-space: nowrap;
}
.status-pill i {
  height: 4px;
  width: 4px;

  border-radius: 50%;
  background: currentColor;
}
.status-pill.consideration {
  background: #fcf4dd;
  color: #a48a36;
}
.status-pill.interview {
  background: #eaf0fc;
  color: #6686bb;
}
.status-pill.rejected {
  background: #f9eae8;

}
.status-pill.secured {
  background: #e7f2e9;
  color: #63906b;
}
.lock-button {

}
.lock-button:hover,.lock-button.locked {

.table-footer {

}
.right-column {

  gap: 18px;
}
.review-summary {

}

  height: 36px;
  width: 36px;

  margin-bottom: 19px;
}
.review-summary [data-slot=badge] {
  position: absolute;
  right: 17px;

  color: #9a8c6f;
  font-size: 9px;
  font-weight: 500;
}
.review-summary h2 {
  font-size: 20px;

}
.review-summary>p {

}
.mini-review {

  width: 100%;
  align-items: center;

  color: #a79d85;
}
.mini-review b {
  display: block;
  font-size: 10px;
  color: #7f755f;
  font-weight: 500;
}
.mini-review small {
  display: block;
  font-size: 9px;
  margin-top: 5px;
}
.full-button {
  width: 100%;
  margin-top: 13px;
  background: #faf8f2;
  color: #8b7f65;
  border-color: #dfd8c8;

  justify-content: space-between;
}
.connection-card {

  border: 1px solid #e4e9e5;
  border-radius: 9px;

}

  margin: 9px 0 18px;

.connection-line {

  gap: 7px;
  font-size: 10px;
  color: #7d8c80;

}
.connection-line small {

  color: #a5ada4;
  font-size: 9px;
}
.connection-line svg {

.text-link {

.bottom-note {

  color: #a0aa9f;
  font-size: 9px;

.content footer {

  border-top: 1px solid #e5eae4;

  font-size: 8px;

}
.content footer span {
  letter-spacing: 0;
}
.mobile-only {

}
.error-notice,.success-notice {

.error-notice {

.heading-count {

.review-list {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 20px;
}
.review-item {

  padding: 24px;
}
.review-item-heading {

  align-items: center;
  gap: 12px;
}
.review-item-heading>div {
  flex: 1;
}
.review-item h3 {
  font-size: 14px;
  margin: 0;

}
.review-item p {
  font-size: 12px;
  color: #8a978c;
  margin: 4px 0;
}
.review-item-heading [data-slot=badge] {

}
.suggestion {

.review-item .review-reason {

.review-actions,.dialog-actions {

.review-actions button {

.empty-state {

.muted {

.small {

.inline-actions {

.info-box p {

.icon-heading {

    font-size: 10px;
  }
  td {
    padding: 19px 18px !important;
  }
  .company-cell strong {
    font-size: 12px;
  }
  .company-cell div>span {
    font-size: 11px;
  }
}
@media (max-width:1190px) {
  .sidebar {
    width: 195px;
    padding-left: 12px;
    padding-right: 12px;
  }
  .content {
    padding: 28px 22px;
  }
  .topbar,.demo-banner {
    padding-left: 22px;
    padding-right: 22px;
  }
  .overview-split {
    grid-template-columns: minmax(0,1fr);
  }
  .right-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .review-summary h2 br {
    display: none;
  }
  .company-cell div>span {
    max-width: none;
  }
  .stat {
    padding: 17px;
  }
  .stat small {
    font-size: 9px;
  }
  .page-heading h1 {
    font-size: 25px;
  }
  .demo-explain {
    display: none;
  }
}
@media (max-width:760px) {
  .app-shell {
    display: block;
  }
  .sidebar {
    position: static;
    width: 100%;
    height: auto;
    padding: 16px;
    border-bottom: 1px solid #e3e9e1;
    display: block;
  }
  .brand {
    padding: 0;
    font-size: 15px;
  }
  .brand br {
    display: none;
  }
  .brand b {
    margin-left: 4px;
  }
  .brand-icon {
    width: 32px;
    height: 32px;
    border-radius: 9px;
  }
  .workspace-label,.sidebar-bottom {
    display: none;
  }
  .sidebar nav {
    display: flex;
    margin-top: 16px;
    gap: 4px;
  }
  .nav-item {
    font-size: 10px;
    padding: 9px 7px;
    gap: 5px;
    margin: 0;
    justify-content: center;
  }
  .nav-item span {
    flex: initial;
  }
  .nav-item svg {
    width: 14px;
  }
  .nav-item em {
    font-size: 8px;
    padding: 0 4px;
  }
  .topbar {
    display: none;
  }
  .demo-banner {
    font-size: 10px;
    padding: 12px 18px;
    gap: 10px;
  }
  .demo-banner button {
    font-size: 9px;
  }
  .content {
    padding: 26px 18px;
  }
  .page-heading {
    display: block;
  }
  .page-heading h1 {
    font-size: 26px;
  }
  .page-heading>button,.page-heading>.badge {
    margin-top: 20px;
  }
  .page-heading p {
    line-height: 1.8;
  }
  .stats-grid {
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
  }
  .stat small {
    font-size: 9px;
  }
  .stat strong {
    font-size: 30px;
  }
  .overview-split {
    gap: 18px;
  }
  .right-column {
    grid-template-columns: 1fr;
  }
  .table-controls {
    padding: 0 14px 17px;
    gap: 7px;
  }
  .section-heading {
    padding: 18px 15px;
  }
  .table-controls select {
    width: 125px;
    font-size: 10px;
  }
  .company-cell {
    gap: 7px;
  }
  .company-avatar {
    width: 26px;
    height: 26px;
    font-size: 10px;
  }
  .company-cell div>span {
    max-width: 145px;
  }
  .company-cell strong {
    font-size: 10px;
  }
  .company-cell div>span {
    font-size: 9px;
  }
  .status-pill {
    font-size: 8px;
    padding: 5px;
  }
  td,th {
    padding: 14px 8px !important;
  }
  td:first-child,th:first-child {
    padding-left: 14px !important;
  }
  .date-cell {
    font-size: 9px;
  }
  .table-footer {
    padding: 15px;
    font-size: 8px;
  }
  .bottom-note {
    line-height: 1.8;
    align-items: flex-start;
  }
  .bottom-note svg {
    flex-shrink: 0;
  }
  .setup-grid,.review-list {
    grid-template-columns: 1fr;
  }
  .setup-card {
    padding: 23px;
  }
  .review-actions {
    flex-wrap: wrap;
  }
  .content footer {
    font-size: 7px;
  }
  .private-label {
    display: none;
  }
  .inline-actions {
    display: block;
  }
  .connected-details {
    flex-wrap: wrap;
  }
}
@media (prefers-reduced-motion:reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
.company-cell strong,.company-cell div>span,.date-cell,.status-pill,.table-footer,.privacy-card p,.page-heading p,.review-card p {
  font-size: 12px !important;
}
.content footer {
  font-size: 11px !important;
}
